<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    /* Card */
.login-card {
    background: #fff;
    padding: 40px 30px;
    border-radius: 15px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.2);
    text-align: center;
}

/* Title */
.login-card h2 {
    margin-bottom: 25px;
    color: #1e3c72;
}

/* Inputs */
.loginForm input {
    width: 100%;
    padding: 12px 15px;
    margin-bottom: 15px;
    border-radius: 8px;
    border: 1px solid #ccc;
    outline: none;
    font-size: 14px;
    transition: 0.3s;
}

.loginForm input:focus {
    border-color: #2a5298;
    box-shadow: 0 0 5px rgba(42,82,152,0.3);
}

/* Button */
.loginForm button {
    width: 100%;
    padding: 12px;
    border: none;
    border-radius: 8px;
    background: #1e3c72;
    color: #fff;
    font-size: 15px;
    cursor: pointer;
    transition: 0.3s;
}

.loginForm button:hover {
    background: #2a5298;
}

/* Responsive */
@media (max-width: 500px) {
    .login-card {
        padding: 30px 20px;
    }
}
</style>
<body>
    
    <main>
        <h2>Welcome Admin of Front Desk!</h2>

        <div class="loginForm">
            <input type="text" id="username" placeholder="Enter Username" required>
            <input type="password" id="password" placeholder="Enter Password" required>
            <button type="submit" onclick="login();">Login</button>
        </div>
    </main>
</body>
<script>

    function login() {
        var username = document.getElementById("username");
        var password = document.getElementById("password");
        
        if(username.value == ""){
            alert("Please enter username to proceed!")
            username.focus();
        } else if (password.value == "") {
            alert("Please enter password to proceed!")
            username.focus();
        } else {
            fetch("php/verifyCredential.php?user=" + username.value + "&pass=" + password.value)
                .then(response => response.text())
                .then(data => {
                    var res = "";
                    res = data;
                if (res === "0") {
                    alert("Account combination is invalid!");
                } else {
                    window.location.href = "index.html";
                }
                })
            
        }
    }
</script>
</html>
